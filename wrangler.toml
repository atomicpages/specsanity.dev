name = "specsanity"
main = "src/worker/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# REQUIRED before deploy: replace the placeholder ids below with real KV
# namespace ids. Create them with:
#   bunx wrangler kv namespace create SHARE_STORE
#   bunx wrangler kv namespace create SHARE_STORE --preview
# `wrangler deploy` will fail while these placeholders remain.
[[kv_namespaces]]
binding = "specsanity"
id = "d34d1132ca7b4d21a13a7c5a6f1ef99d"

# `namespace_id` is any positive integer unique within the Cloudflare account.
# Change it if "1001" is already used by another rate limiter on this account.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[vars]
SHARE_TTL_DAYS = 30
ID_LENGTH = 8
MAX_SPEC_SIZE = 10485760 # 10 MB
MAX_REDIRECTS = 3
FETCH_TIMEOUT_MS = 10_000
